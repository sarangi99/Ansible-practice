---
- hosts: all
  become: yes
  gather_facts: yes
  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
      when: ansible_os_family == "Debian"
    - name: Start Nginx service
      service:
        name: nginx
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"
    - name: Installjavavarfordebian java on debian
      apt:
        name: "{{javavarfordebian}}"
        state: present
      when: ansible_os_family == "Debian"
    - name: Install java on redhat
      yum:
        name: "{{javavarforredhat}}"
        state: present
      when: ansible_os_family == "RedHat"
    - name: Install tomcat on debian
      apt:
        name: "{{tomcatvarfordebian}}"
        state: present
      when: ansible_os_family == "Debian"
    - name: Install tomcat on redhat
      yum:
        name: "{{tomcatvarforredhat}}"
        state: present
      when: ansible_os_family == "RedHat"
